[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kojiki-lm"
version = "0.1.0"
description = "yamatoLLM の TypeScript 型認識特化版 (Qwen2.5-Coder + 月読/凡夫ヘッド)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "cosmopanda432" }]

dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.27",
    "pyarrow>=14",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.43"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src_min"]
